[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vpngate-toolbox"
version = "0.1.0"
description = "Shared VPN Gate pool builder and verified Cloudflare VLESS pipeline"
requires-python = ">=3.9"
license = {text = "GPL-3.0-only"}

[project.scripts]
vpngate-toolbox = "vpngate_toolbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
